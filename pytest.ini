[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for test categorization
markers =
    async: marks tests as asynchronous (deselect with '-m "not async"')
    unit: marks tests as unit tests
    integration: marks tests as integration tests

# Minimum Python version (matching pyproject.toml)
minversion = 3.13

# Asyncio mode for pytest-asyncio
asyncio_mode = auto
